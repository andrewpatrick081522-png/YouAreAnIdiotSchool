<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>You Are An Idiot School</title>
    <style>
        body {
            background-color: white;
            color: black;
            font-family: "Arial Black", Gadget, sans-serif;
            text-align: center;
            margin-top: 10vh;
            /* Optional: Simple CSS flashing effect to match the original style */
            animation: flash 0.5s infinite;
        }

        h1 {
            font-size: 5rem;
        }

        .smiley {
            font-size: 12rem;
            line-height: 1;
        }

        @keyframes flash {
            50% { background-color: black; color: white; }
        }
    </style>
</head>
<body>

    <div class="smiley">☺</div>
    <h1>You are an idiot!</h1>
    <div class="smiley">☺ ☺</div>

</body>
</html>
